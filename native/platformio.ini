[platformio]
default_envs = native_voice, native_intelligence
boards_dir = ../boards
src_dir = main

[env]
platform = espressif32 @ 6.6.0
framework = espidf
platform_packages =
    platformio/framework-espidf@3.40407.240606
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = clawgrid_s3_n16r8
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = ../partitions_n16r8.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -DCLAWGRID_NATIVE_IDF=1

[env:native_voice]
build_flags = ${env.build_flags} -DCLAWGRID_NODE_A=1
upload_port = COM5

[env:native_intelligence]
build_flags = ${env.build_flags} -DCLAWGRID_NODE_B=1
upload_port = COM7

; Explicit opt-in only. Compile does not validate the relay voltage or polarity.
[env:native_voice_bench]
extends = env:native_voice
build_flags = ${env:native_voice.build_flags} -DCLAWGRID_PHYSICAL_OUTPUTS=1

; USB-only fault validation. Never combined with physical outputs.
[env:native_voice_diagnostic]
extends = env:native_voice
build_flags = ${env:native_voice.build_flags} -DCLAWGRID_DIAGNOSTIC_FAULTS=1

; Same inhibited controller over the verified CH343/UART0 USB connection.
[env:native_voice_uart]
extends = env:native_voice
board_build.sdkconfig_defaults = sdkconfig.defaults, sdkconfig.uart.defaults
build_flags = ${env:native_voice.build_flags} -DCLAWGRID_UART_CONSOLE=1

[env:native_voice_uart_diagnostic]
extends = env:native_voice_uart
build_flags = ${env:native_voice_uart.build_flags} -DCLAWGRID_DIAGNOSTIC_FAULTS=1

; Explicit physical bench opt-in with the CH343/UART0 console. Never auto-upload.
[env:native_voice_uart_bench]
extends = env:native_voice_uart
build_flags = ${env:native_voice_uart.build_flags} -DCLAWGRID_PHYSICAL_OUTPUTS=1
